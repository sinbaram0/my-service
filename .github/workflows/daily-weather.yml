name: Daily Seoul Weather

on:
  schedule:
    # UTC 00:10 = Asia/Seoul 09:10, every day.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Fetch Seoul weather
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python get_weather.py
